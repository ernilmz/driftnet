[package]
name = "drift-network"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drift-core = { path = "../drift-core" }
drift-engine = { path = "../drift-engine" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
url.workspace = true
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "time", "macros", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_Networking_WinInet", "Win32_Foundation", "Win32_System_Pipes", "Win32_System_Services"] }

[target.'cfg(target_os="macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray"] }
