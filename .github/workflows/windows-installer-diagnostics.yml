name: Windows installer diagnostics
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Private workflow run containing Driftnet-Windows-native
        required: true
        default: '42367749112'
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Driftnet-Windows-native
          path: target/diagnostic-input
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Diagnose packaged installation and service startup
        shell: pwsh
        run: ./scripts/diagnose-windows-installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Driftnet-Windows-diagnostics
          path: target/windows-diagnostics/
          if-no-files-found: error
          retention-days: 7
