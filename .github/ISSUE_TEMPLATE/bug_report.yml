name: Bug report
description: Report an application, routing, or installation problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Include a small reproduction. Please omit tokens, private chats, account screenshots, and unredacted network captures."
  - type: input
    id: version
    attributes:
      label: Driftnet version
      placeholder: Version shown by the installed package
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: system_version
    attributes:
      label: OS version and architecture
      placeholder: Windows 10 x64, macOS on Apple Silicon, or Linux distribution/version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include whether Access was already on and whether the affected app was reopened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Copy the exact message, with personal information removed.
