[workspace]
members = ["crates/drift-core", "crates/drift-engine", "crates/drift-policy-ffi", "crates/drift-network", "crates/drift-agent", "apps/desktop"]
resolver = "2"
exclude = ["vendor/glib"]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
thiserror = "2"

[patch.crates-io]
# Exact upstream VariantStrIter safety fix for the GTK3-compatible release.
glib = { path = "vendor/glib" }
